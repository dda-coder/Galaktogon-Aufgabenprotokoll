<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GALAKTOGON — Beta 2</title>
<style>
:root{--bg:#050812;--panel:#0b1220;--panel2:#111b2d;--line:#263957;--txt:#eaf3ff;--muted:#8da0bb;--cyan:#62dcff;--green:#72efb0;--amber:#ffd66e;--red:#ff667d;--violet:#b69cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173052,#050812 48%,#020409);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,sans-serif}button{font:inherit;color:var(--txt);background:#14243a;border:1px solid #355274;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--cyan);box-shadow:0 0 12px #62dcff22}.hidden{display:none!important}
#boot{min-height:100vh;display:grid;place-items:center;padding:25px}.bootbox{width:min(620px,100%);padding:30px;background:#08101ddd;border:1px solid #29415f;border-radius:16px;box-shadow:0 20px 80px #000}.logo{font-size:42px;letter-spacing:8px;color:var(--cyan);text-shadow:0 0 25px #62dcff66}.sub{color:var(--muted);margin:5px 0 25px}.bar{height:8px;background:#162337;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--cyan);transition:.15s}
#game{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--line);background:#070d18ee;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:800;color:var(--cyan);letter-spacing:3px;margin-bottom:18px}.nav button{width:100%;margin:4px 0;text-align:left}.nav button.active{border-color:var(--cyan);background:#14304a}.main{padding:20px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.stats{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;background:#0d1829;border:1px solid var(--line);border-radius:999px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 6;background:#0b1220dd;border:1px solid var(--line);border-radius:14px;padding:16px}.wide{grid-column:span 12}.third{grid-column:span 4}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.accent{color:var(--cyan)}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.meter{height:9px;background:#162236;border-radius:8px;overflow:hidden;margin:6px 0 12px}.meter i{display:block;height:100%;background:var(--cyan)}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #1b2b43}.row:last-child{border:0}.actions{display:flex;flex-wrap:wrap;gap:8px}.stars{height:380px;position:relative;overflow:hidden;background:#030811;border-radius:12px;border:1px solid #20334d}.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#bcefff;box-shadow:0 0 8px #62dcff;cursor:pointer}.ship{position:absolute;width:20px;height:8px;background:var(--cyan);border-radius:50%;box-shadow:0 0 18px var(--cyan);transform:translate(-50%,-50%)}.log{height:170px;overflow:auto;background:#050a12;border:1px solid #1c2c42;padding:10px;font-family:ui-monospace,monospace;font-size:12px}.tag{display:inline-block;border:1px solid #385272;border-radius:5px;padding:2px 6px;margin:2px;color:#b8cce5}.mission{padding:12px;border:1px solid #263b58;border-radius:10px;margin:8px 0;background:#0d1727}.choice{margin-top:8px}.big{font-size:28px;font-weight:800}.center{text-align:center}
@media(max-width:800px){#game{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{margin:0}.card,.third{grid-column:span 12}.logo{font-size:30px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<section id="boot"><div class="bootbox"><div class="logo">GALAKTOGON</div><div class="sub">FRONTIER PROTOCOL // BETA 2</div><p id="bootmsg">Initialisiere Sektorkern…</p><div class="bar"><i id="bootbar"></i></div></div></section>
<section id="game" class="hidden">
<aside class="side"><div class="brand">GALAKTOGON</div><div class="muted" id="pilot"></div><div class="nav">
<button data-v="home">Kommando</button><button data-v="galaxy">Galaxie</button><button data-v="missions">Missionen</button><button data-v="ship">Schiff</button><button data-v="inventory">Inventar</button><button data-v="training">Ausbildung</button><button data-v="factions">Fraktionen</button><button data-v="codex">Codex</button>
</div></aside>
<main class="main"><div class="top"><div><div class="muted">SEKTOR 07 // FRONTIER</div><h1 id="title">Kommandozentrum</h1></div><div class="stats"><span class="chip">LV <b id="lv">1</b></span><span class="chip">XP <b id="xp">0</b></span><span class="chip">GC <b id="gc">500</b></span><span class="chip">Ruf <b id="rep">0</b></span></div></div><div id="view"></div></main>
</section>
<script>
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem("GALA_BETA2")||"null")||{name:"Nova",race:"Terraner",level:1,xp:0,gc:500,rep:0,hull:100,energy:100,hyper:100,sector:7,planet:"Asterion",inv:["Standard-Blaster","Medkit","Hyperzelle"],missions:[],logs:[],faction:"Neutral",kills:0};
const races=["Terraner","Avari","Krynn","Myr","Solari","Veyra","Nox","Orin"];
function save(){localStorage.setItem("GALA_BETA2",JSON.stringify(S));updateStats()}
function log(x){S.logs.unshift(new Date().toLocaleTimeString()+" // "+x);S.logs=S.logs.slice(0,40);save()}
function xp(n){S.xp+=n;while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;log("RANGAUFSTIEG // Level "+S.level)}save()}
function updateStats(){$("lv").textContent=S.level;$("xp").textContent=S.xp;$("gc").textContent=S.gc;$("rep").textContent=S.rep;$("pilot").textContent=S.name+" // "+S.race}
function nav(v){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));$("title").textContent={home:"Kommandozentrum",galaxy:"Galaxie",missions:"Missionen",ship:"Schiff",inventory:"Inventar",training:"Ausbildung",factions:"Fraktionen",codex:"Codex"}[v];({home:home,galaxy:galaxy,missions:missions,ship:ship,inventory:inventory,training:training,factions:factions,codex:codex}[v])()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>nav(b.dataset.v));
function home(){$("view").innerHTML=`
<div class="grid">
<div class="card wide"><h2>Frontier-Status</h2><p>Willkommen zurück, <span class="accent">${S.name}</span>. Die Grenze ist instabil. Drei Signale wurden außerhalb bekannter Routen registriert.</p><div class="actions"><button onclick="scanSignal()">Signal analysieren</button><button onclick="xp(10);log('Routine abgeschlossen // +10 XP')">Routine-Quest erledigen</button></div></div>
<div class="card"><h3>Schiffssysteme</h3><div>Hülle <b>${S.hull}%</b></div><div class="meter"><i style="width:${S.hull}%"></i></div><div>Energie <b>${S.energy}%</b></div><div class="meter"><i style="width:${S.energy}%"></i></div><div>Hyperdrive <b>${S.hyper}%</b></div><div class="meter"><i style="width:${S.hyper}%"></i></div></div>
<div class="card"><h3>Aktive Missionen</h3><p>${S.missions.length?S.missions.map(m=>'<span class="tag">'+m+'</span>').join(""):"Keine aktiven Missionen."}</p><button onclick="nav('missions')">Missionsnetz öffnen</button></div>
<div class="card wide"><h3>Systemprotokoll</h3><div class="log">${S.logs.map(x=>"<div>"+x+"</div>").join("")||"Noch keine Ereignisse."}</div></div>
</div>`}
function scanSignal(){let outcomes=["Das Signal antwortet mit einem unvollständigen Sternencode.","Eine fremde Sonde wird entdeckt. Sie verschwindet im Hyperraum.","Die Daten enthalten ein Symbol, das im Codex nicht registriert ist."];log("ANALYSE // "+outcomes[Math.floor(Math.random()*outcomes.length)]);xp(15);nav("home")}
function galaxy(){let stars=Array.from({length:85},(_,i)=>{let x=3+Math.random()*94,y=5+Math.random()*90;return '<span class="star" style="left:'+x+'%;top:'+y+'%" onclick="travel('+i+')"></span>'}).join("");$("view").innerHTML=`<div class="grid"><div class="card wide"><h2>Sternkarte</h2><p class="muted">Klicke auf einen Stern, um eine Hyperraumroute zu berechnen.</p><div class="stars">${stars}<span class="ship" style="left:50%;top:52%"></span></div></div><div class="card"><h3>Aktueller Standort</h3><div class="big">${S.planet}</div><p>Sektor ${S.sector}. Hyperdrive bereit.</p><button onclick="travel(99)">Zufällige Route berechnen</button></div><div class="card"><h3>Entdeckung</h3><p>Unkartierte Systeme können Ressourcen, Piraten oder Spuren der Uldaner enthalten.</p></div></div>`}
function travel(i){if(S.hyper<15){log("HYPERDRIVE // Energie nicht ausreichend.");return}S.hyper-=15;let names=["Asterion","Vhalis","Nereid","Khepri","Orison","Tau Ceti IV","Erebos","Morrow"];S.planet=names[Math.floor(Math.random()*names.length)];S.sector=Math.floor(Math.random()*30)+1;log("HYPERSPRUNG // Ziel "+S.planet+" // Route "+i);xp(10);nav("galaxy")}
function missions(){let pool=[["Signal im Dunkel","Untersuche eine unbekannte Frequenz."],["Grenzpatrouille","Scanne drei Navigationspunkte."],["Verlorene Fracht","Finde eine verschwundene Transportkapsel."],["Uldaner-Spur","Sichere ein Fragment aus einem alten Archiv."]];$("view").innerHTML='<div class="grid"><div class="card wide"><h2>Missionsnetz</h2>'+pool.map((m,i)=>`<div class="mission"><b>${m[0]}</b><div class="muted">${m[1]}</div><div class="choice"><button onclick="acceptMission('${m[0]}',${i})">Annehmen</button></div></div>`).join("")+'</div></div>'}
function acceptMission(name,i){if(S.missions.includes(name)){S.gc+=80+i*30;xp(25+i*5);S.rep+=2;S.missions=S.missions.filter(x=>x!==name);log("MISSION ABGESCHLOSSEN // "+name);save()}else{S.missions.push(name);log("MISSION AKTIV // "+name);save()}nav("missions")}
function ship(){$("view").innerHTML=`<div class="grid"><div class="card"><h2>Schiffsdiagnostik</h2><div class="row"><span>Hülle</span><b>${S.hull}%</b></div><div class="row"><span>Energie</span><b>${S.energy}%</b></div><div class="row"><span>Hyperdrive</span><b>${S.hyper}%</b></div><div class="actions"><button onclick="repair()">Reparieren</button><button onclick="boost()">Energie umleiten</button></div></div><div class="card"><h2>Gefahrensimulation</h2><p>Ein Piratenkontakt kann jederzeit auftreten.</p><button onclick="combat()">Kampf simulieren</button></div></div>`}
function repair(){if(S.gc<50)return log("WERFT // Nicht genug GC.");S.gc-=50;S.hull=Math.min(100,S.hull+35);save();nav("ship")}
function boost(){S.energy=Math.min(100,S.energy+25);S.hyper=Math.max(0,S.hyper-10);log("SYSTEM // Energie in Schilde umgeleitet.");save();nav("ship")}
function combat(){let dmg=Math.floor(Math.random()*31)+10;let win=Math.random()>.3;if(win){let reward=100+Math.floor(Math.random()*100);S.gc+=reward;S.rep+=4;S.kills++;xp(30);log("KAMPF // Sieg // +"+reward+" GC")}else{S.hull-=dmg;S.energy=Math.max(0,S.energy-20);log("KAMPF // Treffer // -"+dmg+" Hülle");if(S.hull<=0){S.hull=25;S.gc=Math.floor(S.gc*.7);log("NOTFALL // Schiff geborgen // 30% GC verloren.")}}save();nav("ship")}
function inventory(){$("view").innerHTML=`<div class="grid"><div class="card wide"><h2>Inventar</h2>${S.inv.map((x,i)=>'<div class="row"><span>'+x+'</span><button onclick="useItem('+i+')">Benutzen</button></div>').join("")}</div></div>`}
function useItem(i){let item=S.inv[i];if(item==="Medkit"){S.hull=Math.min(100,S.hull+25);S.inv.splice(i,1);log("MEDKIT // Hülle repariert.")}else if(item==="Hyperzelle"){S.hyper=Math.min(100,S.hyper+35);S.inv.splice(i,1);log("HYPERZELLE // Hyperdrive geladen.")}else log(item+" // Standardausrüstung.");save();nav("inventory")}
function training(){$("view").innerHTML=`<div class="grid"><div class="card"><h2>Ausbildungssektor</h2><p>Trainiere deine Fähigkeiten und erhalte XP.</p><div class="mission"><b>Navigation</b><p class="muted">Hyperraumrouten schneller einschätzen.</p><button onclick="train('Navigation',20)">Trainieren // +20 XP</button></div><div class="mission"><b>Schiffskampf</b><p class="muted">Trefferchancen und Energiemanagement verbessern.</p><button onclick="train('Schiffskampf',25)">Trainieren // +25 XP</button></div></div><div class="card"><h2>Karriere</h2><p>Aktueller Ausbildungsstand: <span class="accent">Kadett</span></p><p class="muted">Weitere Laufbahnen werden in späteren Betas freigeschaltet.</p></div></div>`}
function train(n,x){xp(x);log("AUSBILDUNG // "+n+" abgeschlossen.");nav("training")}
function factions(){$("view").innerHTML=`<div class="grid"><div class="card wide"><h2>Fraktionen</h2><p>Deine Entscheidungen verändern deinen Ruf.</p><div class="row"><span>Frontier-Allianz</span><b>${S.faction==="Alliance"?"Verbündet":"Neutral"}</b><button onclick="join('Alliance')">Kontakt</button></div><div class="row"><span>Freie Piraten</span><b>${S.faction==="Pirates"?"Pfad gewählt":"Neutral"}</b><button onclick="join('Pirates')">Kontakt</button></div></div></div>`}
function join(f){S.faction=f;if(f==="Pirates"){S.rep-=10;log("ENTSCHEIDUNG // Piratenpfad gewählt. Dieser Pfad ist irreversibel.")}else{S.rep+=5;log("DIPLOMATIE // Frontier-Allianz gewinnt Vertrauen.")}save();nav("factions")}
function codex(){$("view").innerHTML=`<div class="grid"><div class="card"><h2>Codex</h2><p><span class="tag">Uldaner</span> Eine verschwundene Zivilisation. Ihre Archive reagieren auf unbekannte Signale.</p><p><span class="tag">Hyperdrive</span> FTL-Reisen verbrauchen Energie und benötigen eine berechnete Route.</p><p><span class="tag">Frontier</span> Ein Grenzraum voller Handel, Konflikte und unkartierter Systeme.</p></div><div class="card"><h2>Beta 2</h2><p>Diese Version ist ein spielbarer Prototyp. Fortschritt wird lokal im Browser gespeichert.</p><button onclick="localStorage.removeItem('GALA_BETA2');location.reload()">Spielstand zurücksetzen</button></div></div>`}
function create(){if(localStorage.getItem("GALA_BETA2"))return;S.name=prompt("Name des Piloten:","Nova")||"Nova";S.race=prompt("Rasse: "+races.join(", "), "Terraner")||"Terraner";save();log("CHARAKTER ERSTELLT // "+S.name+" // "+S.race)}
let p=0;let t=setInterval(()=>{p+=10;$("bootbar").style.width=p+"%";$("bootmsg").textContent=["Initialisiere Sektorkern…","Synchronisiere Sternkarte…","Prüfe Schiffssysteme…","Lade Missionsnetz…","Uldaner-Archiv versiegelt.","Bereit."][Math.min(5,Math.floor(p/20))];if(p>=100){clearInterval(t);$("boot").classList.add("hidden");$("game").classList.remove("hidden");create();updateStats();nav("home")}},120);
</script>
</body>
</html>
