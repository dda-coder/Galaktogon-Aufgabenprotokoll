name: GAP smoke tests

on:
  push:
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/gap-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/gap-smoke.yml"
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GAP-Smoke-Tests ausführen
        run: node --test tests/gap-smoke.test.mjs tests/gap-smoke.test.cjs
